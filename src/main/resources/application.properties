# ============================================================
# Event-Driven Notification Engine — Application Configuration
# ============================================================

# ----------------------------
# Application Identity
# ----------------------------
spring.application.name=event-driven-notification-engine
server.port=${PORT:8080}
spring.profiles.default=default

# ----------------------------
# PostgreSQL Datasource
# ----------------------------
spring.datasource.url=jdbc:h2:mem:notification_engine_db
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP Connection Pool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.pool-name=NotificationEnginePool

# ----------------------------
# JPA / Hibernate
# ----------------------------
spring.jpa.database=H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# Flyway (disabled in default/dev profile for fast in-memory H2 development)
spring.flyway.enabled=false

# Cache (Caffeine in-memory)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# Security & CORS (permissive in default profile for local testing)
app.security.api-key-enabled=false
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080

# ----------------------------
# Kafka Configuration
# ----------------------------
# Set to 'true' to use simulation mode (no broker required)
app.kafka.simulation-mode=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-engine-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=3
spring.kafka.producer.acks=all
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=5
spring.kafka.producer.buffer-memory=33554432

# Kafka Topics
app.kafka.topics.notification-events=notification-events
app.kafka.topics.notification-dlq=notification-dlq
app.kafka.topics.notification-analytics=notification-analytics

# ----------------------------
# Async / Thread Pool
# ----------------------------
app.async.core-pool-size=10
app.async.max-pool-size=50
app.async.queue-capacity=500
app.async.thread-name-prefix=notification-async-

# ----------------------------
# Scheduling
# ----------------------------
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=notification-scheduler-

# Scheduler cron expressions
app.scheduler.notification-processing.cron=0/30 * * * * ?
app.scheduler.dlq-retry.cron=0 0/5 * * * ?
app.scheduler.analytics-rollup.cron=0 0 * * * ?
app.scheduler.data-retention.cron=0 0 2 * * ?

# ----------------------------
# Notification Engine Settings
# ----------------------------
app.notification.max-retry-attempts=3
app.notification.retry-delay-ms=5000
app.notification.batch-size=100
app.notification.default-ttl-hours=72

# DLQ Settings
app.dlq.max-retry-attempts=5
app.dlq.retry-backoff-multiplier=2.0
app.dlq.initial-retry-delay-ms=1000

# Data Retention
app.compliance.data-retention-days=365
app.compliance.audit-log-retention-days=730

# ----------------------------
# Channel Configuration
# ----------------------------
# Email (placeholder — configure SMTP for real use)
app.channel.email.enabled=true
app.channel.email.from=noreply@notification-engine.com
app.channel.email.simulation=true

# SMS (placeholder — configure Twilio etc. for real use)
app.channel.sms.enabled=true
app.channel.sms.simulation=true

# Push Notification
app.channel.push.enabled=true
app.channel.push.simulation=true

# Slack
app.channel.slack.enabled=true
app.channel.slack.simulation=true

# Webhook
app.channel.webhook.enabled=true
app.channel.webhook.timeout-ms=10000
app.channel.webhook.simulation=true

# ----------------------------
# OpenAPI / Swagger
# ----------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.packages-to-scan=com.notificationengine.controller
springdoc.show-actuator=false

# ----------------------------
# Actuator
# ----------------------------
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true
info.app.name=Event-Driven Notification Engine
info.app.version=1.0.0
info.app.description=Enterprise notification engine with multi-channel delivery

# ----------------------------
# Logging
# ----------------------------
logging.level.root=INFO
logging.level.com.notificationengine=DEBUG
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [corr=%X{correlationId:-none}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] [corr=%X{correlationId:-none}] %-5level %logger{36} - %msg%n
logging.file.name=logs/notification-engine.log
