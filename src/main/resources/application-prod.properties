# =============================================================================
# Production Profile — Event-Driven Notification Engine
# =============================================================================

# Server Port & Identity
server.port=${PORT:8080}
spring.application.name=event-driven-notification-engine

# -----------------------------------------------------------------------------
# 1. PostgreSQL Datasource (Production Connection Pooling)
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification_engine}?sslmode=${DB_SSL_MODE:prefer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Enterprise Pool Tuning
spring.datasource.hikari.pool-name=NotificationEngineHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.auto-commit=true

# -----------------------------------------------------------------------------
# 2. JPA / Hibernate Production Settings (Safe Schema Validation)
# -----------------------------------------------------------------------------
spring.jpa.database=POSTGRESQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Safe production transaction management: validate schema against Flyway, never auto-alter
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.open-in-view=false

# -----------------------------------------------------------------------------
# 3. Flyway Database Migrations
# -----------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# 4. Production Kafka Integration
# -----------------------------------------------------------------------------
app.kafka.simulation-mode=${KAFKA_SIMULATION_MODE:false}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-engine-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.batch-size=32768
spring.kafka.producer.linger-ms=10
spring.kafka.producer.buffer-memory=67108864

# Topics
app.kafka.topics.notification-events=${KAFKA_TOPIC_EVENTS:notification-events}
app.kafka.topics.notification-dlq=${KAFKA_TOPIC_DLQ:notification-dlq}
app.kafka.topics.notification-analytics=${KAFKA_TOPIC_ANALYTICS:notification-analytics}

# -----------------------------------------------------------------------------
# 5. Security & Production CORS
# -----------------------------------------------------------------------------
app.security.api-key-enabled=${APP_SECURITY_ENABLED:true}
app.security.api-key=${APP_SECURITY_API_KEY:prod-secret-api-key-change-me}
app.security.jwt-secret=${APP_SECURITY_JWT_SECRET:prod-jwt-secret-key-32-chars-minimum}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# -----------------------------------------------------------------------------
# 6. Observability & Logging (PII-Safe, Correlation-ID Tagged)
# -----------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.notificationengine=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [corr=%X{correlationId:-none}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [corr=%X{correlationId:-none}] %-5level %logger{36} - %msg%n
logging.file.name=logs/notification-engine-prod.log
