services:
  # -------------------------------------------------------------
  # 1. Spring Boot 3 Backend Web Service (Docker)
  # -------------------------------------------------------------
  - type: web
    name: notification-engine-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: KAFKA_SIMULATION_MODE
        value: "true"
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: 8080

  # -------------------------------------------------------------
  # 2. React Vite Frontend (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: notification-engine-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: oregon
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: notification-engine-backend
          property: url
